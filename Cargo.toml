[workspace]
resolver = "2"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
forge-core = { path = "crates/core" }
forge-store = { path = "crates/store" }
forge-importers = { path = "crates/importers" }
forge-exec-http = { path = "crates/exec_http" }
forge-exec-sql = { path = "crates/exec_sql" }
forge-mcp = { path = "crates/mcp" }

anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
axum = { version = "0.8", features = ["macros"] }
futures-util = { version = "0.3", default-features = false }
clap = { version = "4", features = ["derive", "env"] }
jaq-core = "3.1"
jaq-json = { version = "2.0", features = ["serde"] }
jaq-std = "3.0"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "async-secret-service", "tokio", "crypto-rust"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
rust-embed = { version = "8.7", features = ["mime-guess"] }
rmcp = { version = "3.6", default-features = false, features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sqlparser = { version = "0.63", features = ["visitor"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }
tempfile = "3"
testcontainers-modules = { version = "0.15", features = ["postgres", "mysql"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
wiremock = "0.6"
uuid = { version = "1", features = ["v4", "serde"] }

# Full debug info made target/ grow past 30 GB; line tables keep backtraces useful.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
