name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ui:
    name: ui (typecheck / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm --prefix ui ci
      - run: npm --prefix ui run typecheck
      - run: npm --prefix ui test
      - run: npm --prefix ui run build
      - uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

  check:
    name: fmt / clippy / test (${{ matrix.os }})
    needs: ui
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      # Embed the real UI so the binary under test matches a release build.
      - uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  sql-containers:
    name: SQL read-only layers (Postgres / MySQL in Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: testcontainers tests
        run: cargo test -p forge-exec-sql --test containers -- --ignored

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: docker build -t mcp-forge:ci .
      - name: smoke test
        run: |
          docker run -d --name forge -p 127.0.0.1:7410:7410 -e MCP_FORGE_ADMIN_TOKEN=ci-token-0123456789abcdef mcp-forge:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:7410/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:7410/healthz
          # The API needs the token when listening beyond loopback.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7410/api/projects)" = 401
          curl -fsS -H 'Authorization: Bearer ci-token-0123456789abcdef' http://127.0.0.1:7410/api/projects
          docker logs forge
