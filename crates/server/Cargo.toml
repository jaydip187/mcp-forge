[package]
name = "mcp-forge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Turn HTTP APIs and SQL databases into curated MCP tools, from one self-hosted binary."
readme = "../../README.md"
publish = false

[[bin]]
name = "mcp-forge"
path = "src/main.rs"

[dependencies]
forge-core.workspace = true
forge-exec-http.workspace = true
forge-exec-sql.workspace = true
forge-importers.workspace = true
forge-mcp.workspace = true
forge-store.workspace = true
anyhow.workspace = true
argon2.workspace = true
chrono.workspace = true
axum.workspace = true
clap.workspace = true
hex.workspace = true
reqwest.workspace = true
rmcp.workspace = true
rpassword.workspace = true
rust-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
forge-core.workspace = true
tokio = { workspace = true, features = ["process"] }
reqwest.workspace = true
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
wiremock.workspace = true
tempfile.workspace = true
sqlx.workspace = true

# Released with cargo-dist even though it isn't published to crates.io.
[package.metadata.dist]
dist = true
